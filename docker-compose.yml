services:
  timclip:
    build: .
    container_name: timclip
    ports:
      - "8501:8501"
    volumes:
      # Du lieu he thong (kho van tay, lich su, audio da tai) - giu lai giua cac lan chay
      - ./data:/app/data
      - ./ketqua:/app/ketqua
      # SUA 2 DONG DUOI cho dung o dia cua ban, roi trong giao dien nhap
      # duong dan /clips va /videodai (khong phai D:\...)
      - D:/ClipGoc:/clips:ro
      - D:/VideoDai:/videodai:ro
    restart: unless-stopped
